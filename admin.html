<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branded Bags – Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#f5f5f5;
  color:#111;
}
.top{
  background:#111;
  color:#fff;
  padding:18px 5vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.top a{
  color:#fff;
  text-decoration:none;
  margin-right:12px;
}
.wrap{
  max-width:1200px;
  margin:auto;
  padding:24px 16px;
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}
h1,h2,h3{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}
textarea{min-height:90px}
button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:600;
}
.btn{
  background:#111;
  color:#fff;
}
.light{
  background:#fff;
  color:#111;
  border:1px solid #ccc;
}
.danger{
  background:#b00020;
  color:#fff;
}
.success{
  background:#16803c;
  color:#fff;
}
.note{
  background:#f1f5f9;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
.product{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  background:#fff;
}
.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  float:left;
  margin-right:12px;
}
.product:after{
  content:"";
  display:block;
  clear:both;
}
.price{
  font-weight:700;
  margin:5px 0;
}
.actions{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.order{
  border:1px solid #ddd;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}
.status{
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  display:inline-block;
  font-size:13px;
}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:15px}
}
</style>
</head>

<body>

<div class="top">
  <div>
    <b>Branded Bags – Admin Panel</b>
  </div>
  <div>
    <a href="index.html">Website</a>
    <a href="admin.html">Admin</a>
  </div>
</div>

<div class="wrap">

<div class="card">
  <h2>Admin Dashboard</h2>
  <div class="note">
    यहाँ से products, prices, discounts और orders manage करें।
  </div>
</div>

<div class="card">
  <h2>Add / Edit Product</h2>

  <input type="hidden" id="editId">

  <div class="grid">

    <div>
      <label>Product Name</label>
      <input id="pName" placeholder="Bag name">
    </div>

    <div>
      <label>Category</label>
      <select id="pCategory">
        <option>All Bags</option>
        <option>Women Bags</option>
        <option>Hand Bags</option>
        <option>Sling Bags</option>
        <option>Shoulder Bags</option>
        <option>Combo Bags</option>
        <option>Premium</option>
      </select>
    </div>

    <div>
      <label>Original Price ₹</label>
      <input id="pOriginal" type="number" placeholder="1999">
    </div>

    <div>
      <label>Discount %</label>
      <input id="pDiscount" type="number" value="50">
    </div>

    <div>
      <label>Selling Price ₹</label>
      <input id="pPrice" type="number" placeholder="999">
    </div>

    <div>
      <label>Image URL</label>
      <input id="pImage" placeholder="https://...">
    </div>

  </div>

  <br>

  <label>
    <input id="pCombo" type="checkbox" style="width:auto">
    Combo Bag – discount लागू नहीं करना
  </label>

  <br>

  <label>Description</label>
  <textarea id="pDescription" placeholder="Product description"></textarea>

  <div class="actions">
    <button class="btn" onclick="saveProduct()">Save Product</button>
    <button class="light" onclick="clearForm()">Clear</button>
  </div>
</div>

<div class="card">
  <h2>Products</h2>

  <div class="actions">
    <button class="success" onclick="downloadJson()">Download products.json</button>
    <button class="light" onclick="importJson()">Import products.json</button>
    <button class="danger" onclick="resetCatalog()">Reset Catalog</button>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none">

  <br>

  <div id="productsGrid" class="grid"></div>
</div>

<div class="card">
  <h2>Orders</h2>
  <button class="btn" onclick="loadOrders()">Refresh Orders</button>
  <div id="ordersBox" style="margin-top:15px">
    Loading orders...
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://lkdwjqpjcitnchmibupa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iM4hwDWoyBnhbAzEfWj5Uw_cQumbH5k";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   LOCAL PRODUCT CATALOG
============================== */

const key = "branded_bags_products";

let products = [];

const defaultProducts = [];


/* ==============================
   LOAD PRODUCTS
============================== */

function loadProducts(){

  try{

    const saved =
      localStorage.getItem(key);

    if(saved){

      const data =
        JSON.parse(saved);

      if(Array.isArray(data)){
        products = data;
      }else{
        products = [...defaultProducts];
      }

    }else{

      products = [...defaultProducts];

    }

  }catch(e){

    products = [...defaultProducts];

  }

  renderProducts();

}


/* ==============================
   SAVE PRODUCTS
============================== */

function persist(){

  localStorage.setItem(
    key,
    JSON.stringify(products)
  );

  renderProducts();

}


/* ==============================
   MONEY
============================== */

function money(n){

  return Number(n || 0)
    .toLocaleString("en-IN");

}


/* ==============================
   RENDER PRODUCTS
============================== */

function renderProducts(){

  const box =
    document.getElementById("productsGrid");

  if(!products.length){

    box.innerHTML =
      '<div class="note">No products found. Add a product above or import your products.json.</div>';

    return;
  }

  box.innerHTML =
    products.map((p,index)=>{

      const original =
        Number(p.originalPrice || p.original || p.price || 0);

      const price =
        Number(p.price || p.sellingPrice || 0);

      const discount =
        Number(p.discount || 0);

      return `
      <div class="product">

        ${
          p.image
          ?
          `<img src="${escapeHtml(p.image)}"
                onerror="this.style.display='none'">`
          :
          ''
        }

        <h3>${escapeHtml(p.name || "Unnamed Product")}</h3>

        <div>
          Category:
          <b>${escapeHtml(p.category || "")}</b>
        </div>

        <div class="price">
          Original:
          ₹${money(original)}
        </div>

        <div class="price">
          Selling:
