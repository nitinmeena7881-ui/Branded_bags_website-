<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Branded Bags - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
color:#111;
}

.header{
background:#111;
color:#fff;
padding:22px 5%;
}

.header h1{
margin:0;
font-size:26px;
}

.header p{
margin:6px 0 0;
opacity:.75;
}

.container{
width:min(1100px,94%);
margin:25px auto 60px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:18px;
padding:22px;
margin-bottom:22px;
box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.card h2{
margin:0 0 20px;
font-size:25px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.field{
display:flex;
flex-direction:column;
gap:7px;
}

.full{
grid-column:1/-1;
}

label{
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
background:#fff;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:#111;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin-top:16px;
font-size:17px;
}

.checkbox input{
width:20px;
height:20px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:18px;
}

button{
appearance:none;
-webkit-appearance:none;
border:0;
padding:14px 20px;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
background:#111;
color:#fff;
}

button:active{
transform:scale(.98);
}

.green{
background:#16803c;
}

.red{
background:#c1121f;
}

.white{
background:#fff;
color:#111;
border:1px solid #ccc;
}

.status{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#f1f1f1;
display:none;
}

.product{
display:grid;
grid-template-columns:90px 1fr auto;
gap:15px;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee;
}

.product:last-child{
border-bottom:0;
}

.product img{
width:90px;
height:90px;
object-fit:cover;
border-radius:12px;
background:#eee;
}

.product h3{
margin:0 0 7px;
}

.old{
text-decoration:line-through;
color:#888;
margin-right:8px;
}

.sale{
color:#d00000;
font-weight:bold;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#111;
color:#fff;
font-size:12px;
margin-right:5px;
}

.order{
background:#fafafa;
border:1px solid #ddd;
border-radius:14px;
padding:16px;
margin:12px 0;
}

.order h3{
margin:0 0 10px;
}

.order p{
margin:6px 0;
line-height:1.45;
}

.empty{
padding:20px;
text-align:center;
color:#777;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.product{
grid-template-columns:70px 1fr;
}

.product img{
width:70px;
height:70px;
}

.product .buttons{
grid-column:1/-1;
}

button{
width:100%;
}

}
</style>
</head>

<body>

<div class="header">
<h1>Branded Bags — Admin Panel</h1>
<p>Manage Products, Prices, Discounts & Orders</p>
</div>

<div class="container">

<!-- ================= PRODUCT FORM ================= -->

<div class="card">

<h2 id="formTitle">Add Product</h2>

<input type="hidden" id="productId">

<div class="grid">

<div class="field">
<label>Product Name</label>
<input id="productName" type="text" placeholder="Premium Handbag">
</div>

<div class="field">
<label>Category</label>
<select id="category">
<option value="Ladies Bags">Ladies Bags</option>
<option value="Handbags">Handbags</option>
<option value="Shoulder Bags">Shoulder Bags</option>
<option value="Sling Bags">Sling Bags</option>
<option value="Tote Bags">Tote Bags</option>
<option value="Backpacks">Backpacks</option>
<option value="Combo Bags">Combo Bags</option>
<option value="Premium">Premium</option>
</select>
</div>

<div class="field">
<label>Original Price ₹</label>
<input id="originalPrice" type="number" min="0" placeholder="1999"
oninput="calculatePrice()">
</div>

<div class="field">
<label>Discount %</label>
<input id="discount" type="number" min="0" max="100" value="50"
oninput="calculatePrice()">
</div>

<div class="field">
<label>Selling Price ₹</label>
<input id="sellingPrice" type="number" min="0" placeholder="999">
</div>

<div class="field">
<label>Image URL</label>
<input id="image" type="url" placeholder="https://...">
</div>

<div class="field full">
<label>Description</label>
<textarea id="description"
placeholder="Product description"></textarea>
</div>

</div>

<label class="checkbox">
<input id="combo" type="checkbox" onchange="calculatePrice()">
Combo Bag — discount लागू नहीं करना
</label>

<div class="buttons">

<button type="button" onclick="saveProduct()">
Save Product
</button>

<button type="button" class="white" onclick="clearForm()">
Clear
</button>

</div>

<div id="productStatus" class="status"></div>

</div>


<!-- ================= PRODUCTS ================= -->

<div class="card">

<h2>Products</h2>

<div class="buttons">

<button type="button"
class="green"
onclick="downloadJson()">
Download products.json
</button>

<button type="button"
class="white"
onclick="openImport()">
Import products.json
</button>

<button type="button"
class="red"
onclick="resetCatalog()">
Reset Catalog
</button>

</div>

<input
id="fileInput"
type="file"
accept=".json,application/json"
style="display:none"
onchange="importJson(event)"
>

<div id="productsList">
Loading products...
</div>

</div>


<!-- ================= ORDERS ================= -->

<div class="card">

<h2>Orders</h2>

<div class="buttons">

<button type="button"
onclick="loadOrders()">
Refresh Orders
</button>

</div>

<div id="ordersStatus" class="status"></div>

<div id="ordersList">
Loading orders...
</div>

</div>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lkdwjqpjcitnchmibupa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iM4hwDWoyBnhbAzEfWj5Uw_cQumbH5k";

const STORAGE_KEY =
"branded_bags_products";

let products = [];

let supabaseClient = null;


/* ================= SUPABASE START ================= */

try{

if(
window.supabase &&
typeof window.supabase.createClient === "function"
){

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

}

}catch(error){

console.error(
"Supabase error:",
error
);

}


/* ================= HELPER ================= */

function get(id){

return document.getElementById(id);

}


/* ================= ESCAPE ================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================= PRICE ================= */

function calculatePrice(){

const original =
Number(get("originalPrice").value || 0);

const discount =
Number(get("discount").value || 0);

const combo =
get("combo").checked;

if(original <= 0){

return;

}

if(combo){

get("sellingPrice").value =
original;

return;

}

const selling =
original -
(original * discount / 100);

get("sellingPrice").value =
Math.round(selling);

}


/* ================= LOAD PRODUCTS ================= */

async function loadProducts(){

try{

const saved =
localStorage.getItem(STORAGE_KEY);

if(saved){

const data =
JSON.parse(saved);

if(Array.isArray(data)){

products = data;

}

}else{

try{

const response =
await fetch(
"products.json",
{
cache:"no-store"
}
);

if(response.ok){

const data =
await response.json();

if(Array.isArray(data)){

products = data;

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(products)
);

}

}

}catch(error){

console.log(
"products.json not available"
);

}

}

}catch(error){

console.error(error);

products = [];

}

renderProducts();

}


/* ================= SAVE LOCAL ================= */

function persist(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(products)
);

renderProducts();

}


/* ================= SAVE PRODUCT ================= */

function saveProduct(){

try{

const name =
get("productName").value.trim();

const category =
get("category").value;

const original =
Number(
get("originalPrice").value || 0
);

const discount =
Number(
get("discount").value || 0
);

const enteredSelling =
Number(
get("sellingPrice").value || 0
);

const image =
get("image").value.trim();

const description =
get("description").value.trim();

const combo =
get("combo").checked;

if(!name){

alert("Product Name डालिए।");

return;

}

if(original <= 0){

alert("Original Price डालिए।");

return;

}

let selling =
enteredSelling;

if(combo){

selling = original;

}else if(selling <= 0){

selling =
Math.round(
original -
(original * discount / 100)
);

}

const id =
get("productId").value ||
("bag-" + Date.now());


const product = {

id:id,

name:name,

title:name,

category:category,

originalPrice:original,

price:selling,

sellingPrice:selling,

discount:combo ? 0 : discount,

combo:combo,

image:image,

description:description

};


const existing =
products.findIndex(
p =>
String(p.id) === String(id)
);


if(existing >= 0){

products[existing] =
product;

}else{

products.push(product);

}


persist();

showStatus(
"productStatus",
"Product saved successfully."
);

clearForm();

}catch(error){

console.error(error);

alert(
"Product save error: " +
error.message
);

}

}


/* ================= CLEAR ================= */

function clearForm(){

get("productId").value = "";

get("productName").value = "";

get("category").value =
"Ladies Bags";

get("originalPrice").value = "";

get("discount").value = "50";

get("sellingPrice").value = "";

get("image").value = "";

get("description").value = "";

get("combo").checked = false;

get("formTitle").textContent =
"Add Product";

}


/* ================= STATUS ================= */

function showStatus(id,message){

const box = get(id);

box.textContent = message;

box.style.display = "block";

setTimeout(
function(){

box.style.display = "none";

},
3000
);

}


/* ================= RENDER PRODUCTS ================= */

function renderProducts(){

const box =
get("productsList");

if(!products.length){

box.innerHTML =
'<div class="empty">No products found.</div>';

return;

}

box.innerHTML =
products.map(
function(p){

const original =
Number(
p.originalPrice ??
p.price ??
0
);

const selling =
Number(
p.sellingPrice ??
p.price ??
0
);

const discount =
p.combo
? 0
: Number(p.discount || 0);

const image =
p.image ||
"https://via.placeholder.com/90?text=Bag";

return `

<div class="product">

<img
src="${esc(image)}"
alt="${esc(p.name || "Product")}"
onerror="this.src='https://via.placeholder.com/90?text=Bag'"
>

<div>

<h3>
${esc(p.name || "Unnamed Product")}
</h3>

<div>

<span class="badge">
${esc(p.category || "Bags")}
</span>

${
p.combo
? '<span class="badge">COMBO</span>'
: ''
}

</div>

<div style="margin-top:8px">

<span class="old">
₹${original}
</span>

<span class="sale">
₹${selling}
</span>

${
discount > 0
? `<span class="sale"> (${discount}% OFF)</span>`
: ''
}

</div>

</div>

<div class="buttons">

<button
type="button"
class="white"
onclick="editProduct('${String(p.id).replace(/'/g,"\\'")}')">
Edit
</button>

<button
type="button"
class="red"
onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">
Delete
</button>

</div>

</div>

`;

}
).join("");

}


/* ================= EDIT ================= */

function editProduct(id){

const p =
products.find(
item =>
String(item.id) === String(id)
);

if(!p){

return;

}

get("productId").value =
p.id || "";

get("productName").value =
p.name || p.title || "";

get("category").value =
p.category || "Ladies Bags";

get("originalPrice").value =
p.originalPrice ||
p.price ||
"";

get("discount").value =
p.discount ?? 50;

get("sellingPrice").value =
p.sellingPrice ??
p.price ??
"";

get("image").value =
p.image || "";

get("description").value =
p.description || "";

get("combo").checked =
Boolean(p.combo);

get("formTitle").textContent =
"Edit Product";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ================= DELETE ================= */

function deleteProduct(id){

if(
!confirm(
"क्या आप यह product delete करना चाहते हैं?"
)
){

return;

}

products =
products.filter(
p =>
String(p.id) !== String(id)
);

persist();

}


/* ================= DOWNLOAD ================= */

function downloadJson(){

try{

const blob =
new Blob(
[
JSON.stringify(
products,
null,
2
)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download =
"products.json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

}catch(error){

alert(
"Download error: " +
error.message
);

}

}


/* ================= IMPORT OPEN ================= */

function openImport(){

get("fileInput").click();

}


/* ================= IMPORT ================= */

async function importJson(event){

const file =
event.target.files &&
event.target.files[0];

if(!file){

return;

}

try{

const text =
await file.text();

const data =
JSON.parse(text);

if(!Array.isArray(data)){

throw new Error(
"Invalid JSON"
);

}

products = data;

persist();

alert(
"Products imported successfully."
);

}catch(error){

console.error(error);

alert(
"Invalid products.json file."
);

}

event.target.value = "";

}


/* ================= RESET ================= */

function resetCatalog(){

if(
!confirm(
"Reset catalog? Local changes will be removed."
)
){

return;

}

localStorage.removeItem(
STORAGE_KEY
);

location.reload();

}


/* ================= ORDERS ================= */

async function loadOrders(){

const box =
get("ordersList");

box.innerHTML =
"Loading orders...";


if(!supabaseClient){

box.innerHTML =
`
<div class="empty">
Supabase connection available नहीं है।
</div>
`;

return;

}


try{

const result =
await supabaseClient
.from("orders")
.select("*")
.order(
"created_at",
{
ascending:false
}
);

const data =
result.data;

const error =
result.error;


if(error){

console.error(error);

box.innerHTML =
`
<div class="empty">

Orders load नहीं हुए।<br><br>

${esc(error.message)}

</div>
`;

return;

}


if(!data || data.length === 0){

box.innerHTML =
`
<div class="empty">
No orders found.
</div>
`;

return;

}


box.innerHTML =
data.map(
function(order){

const name =
order.name ||
order.customer_name ||
"Customer";

const mobile =
order.mobile ||
order.phone ||
"";

const house =
order.house ||
"";

const address =
order.address ||
"";

const city =
order.city ||
"";

const state =
order.state ||
"";

const pin =
order.pin ||
"";

const landmark =
order.landmark ||
"";

const note =
order.note ||
"";

const total =
order.total_amount ??
order.total ??
0;

const payment =
order.payment_status ||
"Pending";

const status =
order.order_status ||
"New";

const created =
order.created_at
? new Date(
order.created_at
).toLocaleString("en-IN")
: "";


let itemsHtml = "";


if(order.items){

try{

const items =
typeof order.items === "string"
? JSON.parse(order.items)
: order.items;


if(Array.isArray(items)){

itemsHtml =
items.map(
function(item){

const itemName =
item.name ||
item.title ||
"Product";

const qty =
item.quantity ||
item.qty ||
1;

return `
<div>
${esc(itemName)}
× ${Number(qty)}
</div>
`;

}
).join("");

}

}catch(e){

itemsHtml =
esc(
String(order.items)
);

}

}


return `

<div class="order">

<h3>
${esc(name)}
</h3>

<p>
<strong>Mobile:</strong>
${esc(mobile)}
</p>

<p>
<strong>Address:</strong>
${esc(house)}
${house && address ? ", " : ""}
${esc(address)}
${city ? ", " + esc(city) : ""}
${state ? ", " + esc(state) : ""}
${pin ? " - " + esc(pin) : ""}
</p>

${
landmark
? `
<p>
<strong>Landmark:</strong>
${esc(landmark)}
</p>
`
: ""
}

${
itemsHtml
? `
<p>
<strong>Items:</strong><br>
${itemsHtml}
</p>
`
: ""
}

<p>
<strong>Total:</strong>
₹${Number(total)}
</p>

<p>
<strong>Payment:</strong>
${esc(payment)}
</p>

<p>
<strong>Order Status:</strong>
${esc(status)}
</p>

${
note
? `
<p>
<strong>Note:</strong>
${esc(note)}
</p>
`
: ""
}

${
created
? `
<p>
<strong>Order Date:</strong>
${esc(created)}
</p>
`
: ""
}

</div>

`;

}
).join("");


}catch(error){

console.error(error);

box.innerHTML =
`
<div class="empty">

Orders load करने में error आया।<br><br>

${esc(error.message)}

</div>
`;

}

}


/* ================= START ================= */

loadProducts();

loadOrders();

</script>

</body>
  </html>
