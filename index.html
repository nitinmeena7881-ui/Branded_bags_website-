<script>
const WHATSAPP_NUMBER = "917658868426";
const SUPPORT_NUMBER = "918764373020";

let products = [];
let cart = JSON.parse(localStorage.getItem("bb_cart") || "[]");

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function toast(message){
  const box = document.getElementById("toast");
  if(!box) return;
  box.textContent = message;
  box.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 2200);
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function normalizeProduct(p, index){
  const type = String(p.type || "sale").toLowerCase() === "combo"
    ? "combo"
    : "sale";

  return {
    ...p,
    id: String(p.id ?? ("product-" + index)),
    name: p.name || ("Product " + (index + 1)),
    category: p.category || "Bags",
    image: p.image || "",
    originalPrice: Number(p.originalPrice || p.price || 0),
    price: Number(p.price || 0),
    badge: p.badge || (type === "combo" ? "COMBO" : "50% OFF"),
    type
  };
}

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){
  try{
    const response = await fetch("./products.json?version=" + Date.now(), {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error("products.json could not be loaded");
    }

    const data = await response.json();

    if(!Array.isArray(data)){
      throw new Error("products.json must contain an array");
    }

    products = data.map(normalizeProduct);

    console.log("Products loaded:", products.length);

    renderAll();

  }catch(error){
    console.error("PRODUCT LOAD ERROR:", error);

    document.getElementById("saleGrid").innerHTML =
      '<div class="empty">Products could not be loaded. Please check products.json.</div>';

    document.getElementById("comboGrid").innerHTML =
      '<div class="empty">Combo products could not be loaded.</div>';

    document.getElementById("allGrid").innerHTML =
      '<div class="empty">Products could not be loaded.</div>';
  }
}

/* =========================
   PRODUCT CARD
========================= */

function card(p){

  const isCombo = p.type === "combo";

  const discount =
    (!isCombo &&
     p.originalPrice > 0 &&
     p.originalPrice > p.price)
    ? Math.round((1 - p.price / p.originalPrice) * 100)
    : 0;

  return `
    <article class="card">

      <div class="photo">

        <img
          src="${esc(p.image)}"
          alt="${esc(p.name)}"
          loading="lazy"
          onerror="this.style.opacity='.35'"
        >

        <span class="badge ${isCombo ? "combo" : ""}">
          ${esc(p.badge)}
        </span>

      </div>

      <div class="info">

        <div class="cat">
          ${esc(p.category)}
        </div>

        <div class="name">
          ${esc(p.name)}
        </div>

        <div class="price">

          <strong>
            ${money(p.price)}
          </strong>

          ${
            p.originalPrice > p.price
            ? `<del>${money(p.originalPrice)}</del>`
            : ""
          }

        </div>

        ${
          discount > 0
          ? `<div class="saving">You save ${discount}%</div>`
          : ""
        }

        <div class="card-actions">

          <button
            class="smallbtn"
            onclick="addCart('${esc(p.id)}')">
            Add to Cart
          </button>

          <button
            class="smallbtn buy"
            onclick="buyNow('${esc(p.id)}')">
            Buy Now
          </button>

        </div>

      </div>

    </article>
  `;
}

/* =========================
   RENDER EVERYTHING
========================= */

function renderAll(){

  const sale = products.filter(p => p.type === "sale");
  const combos = products.filter(p => p.type === "combo");

  document.getElementById("saleGrid").innerHTML =
    sale.length
    ? sale.map(card).join("")
    : '<div class="empty">No sale products available.</div>';

  document.getElementById("comboGrid").innerHTML =
    combos.length
    ? combos.map(card).join("")
    : '<div class="empty">No combo products available.</div>';

  const categories = [
    "All",
    ...new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    )
  ];

  document.getElementById("filters").innerHTML =
    categories.map((cat, index) => `
      <button
        class="filter ${index === 0 ? "active" : ""}"
        onclick='filterCat(${JSON.stringify(cat)}, this)'>
        ${esc(cat)}
      </button>
    `).join("");

  renderGrid("All");

  updateCart();
}

/* =========================
   ALL PRODUCTS FILTER
========================= */

function renderGrid(category){

  const list =
    category === "All"
    ? products
    : products.filter(p => p.category === category);

  document.getElementById("allGrid").innerHTML =
    list.length
    ? list.map(card).join("")
    : '<div class="empty">No products in this category.</div>';
}

function filterCat(category, button){

  document
    .querySelectorAll(".filter")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  renderGrid(category);
}

/* =========================
   CART
========================= */

function addCart(id){

  const product = products.find(p => p.id === String(id));

  if(!product){
    toast("Product not found");
    return;
  }

  const existing = cart.find(item => item.id === product.id);

  if(existing){
    existing.qty += 1;
  }else{
    cart.push({
      id: product.id,
      qty: 1
    });
  }

  saveCart();

  toast("Added to cart");
}

function buyNow(id){

  const product = products.find(p => p.id === String(id));

  if(!product){
    toast("Product not found");
    return;
  }

  cart = [{
    id: product.id,
    qty: 1
  }];

  saveCart();

  openCheckout();
}

function saveCart(){

  localStorage.setItem(
    "bb_cart",
    JSON.stringify(cart)
  );

  updateCart();
}

function getCartProducts(){

  return cart
    .map(item => {

      const product =
        products.find(p => p.id === String(item.id));

      if(!product) return null;

      return {
        ...product,
        qty: Number(item.qty || 1)
      };

    })
    .filter(Boolean);
}

function updateCart(){

  const items = getCartProducts();

  const count =
    items.reduce((sum, item) => sum + item.qty, 0);

  const countBox =
    document.getElementById("cartCount");

  if(countBox){
    countBox.textContent = count;
  }

  const container =
    document.getElementById("cartItems");

  if(!container) return;

  if(!items.length){

    container.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    document.getElementById("cartTotal").textContent =
      "Total: ₹0";

    return;
  }

  container.innerHTML = items.map(item => `

    <div class="cart-item">

      <img
        src="${esc(item.image)}"
        alt="${esc(item.name)}"
      >

      <div class="cart-details">

        <div class="cart-name">
          ${esc(item.name)}
        </div>

        <div>
          ${money(item.price)}
        </div>

        <div class="qty">

          <button
            onclick="changeQty('${esc(item.id)}', -1)">
            −
          </button>

          <span>${item.qty}</span>

          <button
            onclick="changeQty('${esc(item.id)}', 1)">
            +
          </button>

          <button
            class="remove"
            onclick="removeCart('${esc(item.id)}')">
            Remove
          </button>

        </div>

      </div>

    </div>

  `).join("");

  const total =
    items.reduce(
      (sum, item) =>
        sum + item.price * item.qty,
      0
    );

  document.getElementById("cartTotal").textContent =
    "Total: " + money(total);
}

function changeQty(id, change){

  const item =
    cart.find(x => x.id === String(id));

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){
    cart = cart.filter(
      x => x.id !== String(id)
    );
  }

  saveCart();
}

function removeCart(id){

  cart = cart.filter(
    x => x.id !== String(id)
  );

  saveCart();

  toast("Removed from cart");
}

function openCart(){

  document
    .getElementById("cartDrawer")
    .classList.add("open");

  updateCart();
}

function closeCart(){

  document
    .getElementById("cartDrawer")
    .classList.remove("open");
}

/* =========================
   ACCOUNT
========================= */

function openLogin(){

  const account =
    JSON.parse(
      localStorage.getItem("bb_account") || "null"
    );

  if(account){

    document.getElementById("loginName").value =
      account.name || "";

    document.getElementById("loginEmail").value =
      account.email || "";

    document.getElementById("loginPhone").value =
      account.phone || "";
  }

  document
    .getElementById("loginModal")
    .classList.add("open");
}

function closeLogin(){

  document
    .getElementById("loginModal")
    .classList.remove("open");
}

function saveAccount(){

  const name =
    document.getElementById("loginName").value.trim();

  const email =
    document.getElementById("loginEmail").value.trim();

  const phone =
    document.getElementById("loginPhone").value.trim();

  if(!name || !phone){

    toast("Please enter name and mobile number");

    return;
  }

  localStorage.setItem(
    "bb_account",
    JSON.stringify({
      name,
      email,
      phone
    })
  );

  toast("Account saved");

  closeLogin();
}

/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  const items = getCartProducts();

  if(!items.length){

    toast("Your cart is empty");

    return;
  }

  closeCart();

  document
    .getElementById("checkoutModal")
    .classList.add("open");

  showDetailsStep();
}

function closeCheckout(){

  document
    .getElementById("checkoutModal")
    .classList.remove("open");

  clearTimeout(window.paymentTimer);
}

function showDetailsStep(){

  document
    .getElementById("detailsStep")
    .classList.remove("hidden");

  document
    .getElementById("timerStep")
    .classList.add("hidden");

  document
    .getElementById("paymentStep")
    .classList.add("hidden");

  document.getElementById(
    "checkoutSubtitle"
  ).textContent =
    "First enter your delivery details.";
}

function continueToPayment(){

  const name =
    document.getElementById("cName").value.trim();

  const phone =
    document.getElementById("cPhone").value.trim();

  const address =
    document.getElementById("cAddress").value.trim();

  const pincode =
    document.getElementById("cPincode").value.trim();

  if(!name){

    toast("Please enter your full name");

    return;
  }

  if(!/^[0-9]{10}$/.test(phone)){

    toast("Enter a valid 10-digit mobile number");

    return;
  }

  if(!address){

    toast("Please enter your delivery address");

    return;
  }

  if(!/^[0-9]{6}$/.test(pincode)){

    toast("Enter a valid 6-digit pincode");

    return;
  }

  localStorage.setItem(
    "bb_checkout_customer",
    JSON.stringify({
      name,
      phone,
      address,
      pincode
    })
  );

  document
    .getElementById("detailsStep")
    .classList.add("hidden");

  document
    .getElementById("timerStep")
    .classList.remove("hidden");

  document
    .getElementById("paymentStep")
    .classList.add("hidden");

  document.getElementById(
    "checkoutSubtitle"
  ).textContent =
    "Preparing secure payment...";

  let seconds = 2;

  document.getElementById(
    "paymentTimer"
  ).textContent = seconds;

  clearInterval(window.paymentTimer);

  window.paymentTimer =
    setInterval(() => {

      seconds--;

      document.getElementById(
        "paymentTimer"
      ).textContent = seconds;

      if(seconds <= 0){

        clearInterval(window.paymentTimer);

        showPaymentStep();
      }

    }, 1000);
}

function showPaymentStep(){

  document
    .getElementById("timerStep")
    .classList.add("hidden");

  document
    .getElementById("paymentStep")
    .classList.remove("hidden");

  document.getElementById(
    "checkoutSubtitle"
  ).textContent =
    "Complete payment and confirm your order.";
}

/* =========================
   PLACE ORDER / WHATSAPP
========================= */

function placeOrder(){

  const customer =
    JSON.parse(
      localStorage.getItem("bb_checkout_customer") || "null"
    );

  if(!customer){

    toast("Please enter your details first");

    showDetailsStep();

    return;
  }

  const items = getCartProducts();

  if(!items.length){

    toast("Your cart is empty");

    closeCheckout();

    return;
  }

  const total =
    items.reduce(
      (sum, item) =>
        sum + item.price * item.qty,
      0
    );

  let message =
    "🛍️ *NEW ORDER - BRANDED BAGS*%0A%0A";

  message +=
    "*Customer Details*%0A";

  message +=
    "Name: " +
    encodeURIComponent(customer.name) +
    "%0A";

  message +=
    "Mobile: " +
    encodeURIComponent(customer.phone) +
    "%0A";

  message +=
    "Address: " +
    encodeURIComponent(customer.address) +
    "%0A";

  message +=
    "Pincode: " +
    encodeURIComponent(customer.pincode) +
    "%0A%0A";

  message +=
    "*Order Items*%0A";

  items.forEach((item, index) => {

    message +=
      (index + 1) +
      ". " +
      encodeURIComponent(item.name) +
      " × " +
      item.qty +
      " = " +
      encodeURIComponent(
        money(item.price * item.qty)
      ) +
      "%0A";

  });

  message +=
    "%0A*Total: " +
    encodeURIComponent(money(total)) +
    "*%0A%0A";

  message +=
    "Payment: Online Payment%0A";

  message +=
    "Payment proof will be shared on WhatsApp.";

  const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    message;

  window.open(url, "_blank");

  toast("Opening WhatsApp...");

}

/* =========================
   SUPPORT
========================= */

function whatsappSupport(){

  const url =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(
      "Hello Branded Bags, I need help with my order."
    );

  window.open(url, "_blank");
}

function contactSupport(){

  const url =
    "https://wa.me/" +
    SUPPORT_NUMBER +
    "?text=" +
    encodeURIComponent(
      "Hello Branded Bags, I need customer support."
    );

  window.open(url, "_blank");
}

/* =========================
   START WEBSITE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadProducts();

  }
);
</script>
